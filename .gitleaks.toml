# gitleaks configuration.
#
# Extends the default ruleset — this file ONLY adds allowlist entries. Never
# disable a rule here; if a rule is noisy, narrow the path it applies to.

[extend]
useDefault = true

# NOTE ON FORM: `[allowlist]` (singular table) is honoured by every gitleaks
# v8; `[[allowlists]]` (array) only by newer builds. The action pins its own
# version, so declare the singular form to avoid depending on which it ships.
[allowlist]
description = """
Generated, fully-derived bundles. NOT hand-written, and nothing secret can
reach them.

gitleaks' `generic-api-key` rule is an entropy heuristic, and minified
JavaScript on a single 500KB line trips it reliably. mobile/components/
xterm-bundle.ts produced two such hits the moment it was regenerated for
xterm 6 — both inside inlined xterm.js, neither a credential.

These paths are safe to allowlist because their contents are not authored:

  mobile/components/xterm-bundle.ts
      Generated by mobile/scripts/gen-xterm-bundle.js purely from
      node_modules/@xterm/*. A person cannot put a secret in it without
      editing the generator, which is itself scanned.

  resources/tree-sitter/*.wasm
      Compiled WASM, copied from the web-tree-sitter package.

Both are additionally covered by tests/e2e/build-artifacts.test.ts, which
fails if either drifts from the package it was generated from. So "it is
generated" is an enforced property here, not an assumption.

ONLY add a path here when its contents are entirely machine-generated AND
something verifies that. A hand-edited file must never appear in this list.
"""
paths = [
  '''mobile/components/xterm-bundle\.ts$''',
  '''.*xterm-bundle\.ts$''',
  '''resources/tree-sitter/.*\.wasm$''',
]

# Well-known public constants that are not secrets.
#
# gitleaks scans COMMITS, not the working tree, so an inline `gitleaks:allow`
# added in a later commit does not clear a finding from an earlier one. A
# regex allowlist applies regardless of which commit the string appears in,
# which is the only thing that works for a value already in history.
#
# dGhlIHNhbXBsZSBub25jZQ== is the literal example Sec-WebSocket-Key from
# RFC 6455 §1.3 — base64 of "the sample nonce". A WebSocket handshake
# requires the header; the server echoes a hash of it back and never uses it
# for authorisation. It is published in the RFC itself.
#
# Only add a value here when it is a PUBLISHED constant from a specification
# or a documented example — never a value that is merely believed unused.
regexes = [
  '''dGhlIHNhbXBsZSBub25jZQ==''',
]
