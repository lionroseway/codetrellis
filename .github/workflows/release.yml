# Multi-platform release workflow.
#
# Triggered by:
#   - `git push` of a `v*` tag (e.g. `v0.1.1`) — produces a public GitHub Release
#   - manual dispatch from the Actions tab — produces a draft Release
#
# Builds via electron-builder + electron-vite (replaced electron-forge,
# which needed Wine on macOS for the Windows installer). Each runner
# now builds for its native OS — keeps signing, notarization, and
# rpmbuild paths simple:
#
#   macos-14       → CodeTrellis-<version>-arm64.dmg + x64.dmg + zips
#   ubuntu-latest  → .deb, .rpm, .AppImage
#   windows-latest → CodeTrellis-Setup-<version>.exe (NSIS) + Portable.exe
#
# Code-signing scaffolding is wired via env: set the relevant repo
# secrets and electron-builder will pick them up automatically.
# Without secrets, the workflow still produces unsigned builds (warns
# at install on Gatekeeper / SmartScreen).

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write     # needed by softprops/action-gh-release

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14         # arm64 host, builds arm64 + x64 DMGs
            label: macOS
            package_script: package:mac-universal
            artifact_glob: |
              out/make/*.dmg
              out/make/*.zip
          - os: ubuntu-latest
            label: Linux
            package_script: package:linux
            artifact_glob: |
              out/make/*.deb
              out/make/*.rpm
              out/make/*.AppImage
          - os: windows-latest
            label: Windows
            package_script: package:win
            artifact_glob: |
              out/make/*.exe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build-info uses `git rev-list --count HEAD`

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # rpm tooling for the Linux runner — `dpkg-deb` is preinstalled
      # on ubuntu-latest, but rpmbuild is not.
      - name: Install rpm (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y rpm

      - name: Build
        env:
          # macOS code-signing + notarization (no-op without secrets).
          # electron-builder reads these standard env names directly.
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code-signing (no-op without secrets).
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run ${{ matrix.package_script }}

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: codetrellis-${{ matrix.label }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Inspect collected artefacts
        run: |
          ls -la artifacts/
          find artifacts -type f -printf '%p (%s bytes)\n'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
