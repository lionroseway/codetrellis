# Hermetic E2E harness — MANUAL / NIGHTLY runs.
#
# This is the ONLY place the harness runs. It does not gate pull requests:
# it is green (139 passed, 16 skipped, 0 failed) but takes 99s locally and
# more than 20 minutes on ubuntu-latest, where it hit the job timeout. The
# reasoning is in ci.yml's header, along with what would let it gate again.
#
#   Button:  Actions -> "e2e harness" -> Run workflow
#   CLI:     gh workflow run e2e-harness.yml --ref <branch>
#   Nightly: 03:00 UTC on main
#
# It deliberately does NOT trigger on pull_request — that would run the suite
# twice on every PR.
#
# IF IT FAILS WHOLESALE, CHECK THE NATIVE BINDING FIRST.
#
# A wrong-architecture better_sqlite3.node makes every backend-booting test
# fail in initDatabase, which reports as ~88 unrelated failures across the
# suite and reads exactly like flakiness. It is not. Run:
#
#     npm rebuild better-sqlite3
#     file node_modules/better-sqlite3/build/Release/better_sqlite3.node
#
# This workflow has a "Verify native binding" step that fails fast on exactly
# that, so it can never again present as ~88 mystery test failures.

name: e2e harness

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to run against (defaults to the selected ref)'
        required: false
        type: string
  schedule:
    # 03:00 UTC nightly on the default branch.
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: E2E harness
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    # 45, not 30. Measured: the suite runs 99s locally and did NOT finish in
    # 20 minutes on ubuntu-latest — workers: 1, and every test boots a backend
    # through tsx. Give the nightly room to actually complete, so the result
    # is a real pass/fail rather than a timeout.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Guard against the failure that made this suite look flaky for months.
      # A wrong-architecture better_sqlite3.node makes every backend-booting
      # test die in initDatabase — reported as ~88 unrelated failures. Fail
      # here with the fix instead.
      - name: Verify native binding
        run: |
          node -e "const B=require('better-sqlite3');new B(':memory:').exec('create table t(a)');console.log('better-sqlite3 OK on',process.version,process.arch)" \
            || { echo "::error::better-sqlite3 native binding failed to load — wrong arch or Node version. Try: npm rebuild better-sqlite3"; exit 1; }

      # The harness git-inits its fixture repo, so git needs an identity or the
      # first commit fails with "Author identity unknown".
      - name: Configure git for fixtures
        run: |
          git config --global user.email "ci@codetrellis.invalid"
          git config --global user.name "CodeTrellis CI"

      - name: Install Playwright runner
        run: npx playwright install --with-deps chromium

      - name: Harness suite
        run: npm run test:harness

      # The suite has bailed early before (67 tests not run) — which reads as a
      # pass if you only glance at the exit code of a `continue-on-error` job.
      # Keep the report even on failure so the bail is visible.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
