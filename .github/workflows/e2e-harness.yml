# Hermetic E2E harness — ON DEMAND.
#
# WHY THIS IS NOT IN ci.yml
#
# It is too slow and too flaky to fire on every pull request, measured rather
# than assumed:
#
#   - playwright.harness.config.ts sets `workers: 1`, because every test boots
#     a real backend subprocess (tsx + sql.js/better-sqlite3 + tree-sitter +
#     chokidar) and running them concurrently is unstable. The suite is serial
#     by design.
#   - It sets `retries: 2`, and the comment there names the timing-sensitive
#     tests (file-watcher auto-advance, chokidar plan-import). A suite that
#     needs retries is telling you it is flaky.
#   - Local run on an M-series Mac: 380s, and it bailed with 67 tests not run.
#     A GitHub-hosted runner is slower again.
#
# Leaving it on every PR — even as a non-blocking job — meant ten minutes of
# runner time and a permanently pending check on every push, for a signal
# nobody could act on. So it runs when someone asks for it, and nightly so it
# cannot rot unwatched.
#
# HOW TO RUN IT
#
#   Button:  Actions -> "e2e harness" -> Run workflow
#   CLI:     gh workflow run e2e-harness.yml --ref <branch>
#   On a PR: add the `run-e2e` label (remove and re-add to run it again)
#   Nightly: 03:00 UTC on main, automatically
#
# WHEN IT GOES BACK INTO ci.yml AS A BLOCKING GATE
#
# When it runs green three times running and finishes in a time anyone would
# wait for. Then move the job into ci.yml and add it to ci-passed's `needs`.
# Until then this file is the record of a known debt, not a parking space —
# the nightly run is what keeps it honest.

name: e2e harness

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to run against (defaults to the selected ref)'
        required: false
        type: string
  pull_request:
    types: [labeled]
  schedule:
    # 03:00 UTC nightly on the default branch.
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: E2E harness
    # On a pull_request event this only fires for the `run-e2e` label — every
    # other label (dependencies, mobile, ci, claude-review …) must not start a
    # ten-minute suite.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-e2e'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # The harness git-inits its fixture repo, so git needs an identity or the
      # first commit fails with "Author identity unknown".
      - name: Configure git for fixtures
        run: |
          git config --global user.email "ci@codetrellis.invalid"
          git config --global user.name "CodeTrellis CI"

      - name: Install Playwright runner
        run: npx playwright install --with-deps chromium

      - name: Harness suite
        run: npm run test:harness

      # The suite has bailed early before (67 tests not run) — which reads as a
      # pass if you only glance at the exit code of a `continue-on-error` job.
      # Keep the report even on failure so the bail is visible.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
