# Continuous integration for pull requests into main.
#
# WHAT BLOCKS, AND WHAT DOES NOT
#
# Branch protection requires exactly one context from this file: "CI passed".
# That job is an aggregator — it depends on every real job and fails if any of
# them failed. Pin the aggregator, never the individual jobs, or protection has
# to be re-pinned every time a job is added or renamed.
#
# The Claude review (claude-review.yml) is deliberately NOT required. An LLM
# reviewer is not deterministic, and a gate that fires inconsistently is one
# people learn to click past. Findings it repeats graduate into checks *here*,
# and those block.
#
# WHY GITHUB-HOSTED RUNNERS
#
# This repository is public, so Actions minutes are free. cocodraw routes CI to
# a self-hosted VPS runner because it is private and minutes are metered; there
# is nothing to gain from that here, and a self-hosted runner would add a
# contended slot for no benefit. vars.CI_RUNNER is still honoured so the
# decision is one repository variable away if this repo ever goes private.
#
# LINT
#
# `npm run lint` gates the desktop job: 0 errors required, warnings allowed
# (the severity split is explained in eslint.config.mjs). It was commented
# out here on the premise that eslint wasn't installed; by Phase 32 it was
# (`eslint ^9.39.5`) and passed with 0 errors, so the gate was simply
# missing. Enabled in Phase 32 §0.3.
#
# WHAT ACTUALLY BLOCKS ON A PR
#
#   no-private-docs   seconds   this repo is public
#   desktop           ~1 min    typecheck, bundle guard, web build, unit tests, lint
#   mobile            ~30 s     typecheck
#   html-view         ~1 min    the sandboxed HTML view, a hostile report, real Electron
#   harness           ~4 min    the hermetic E2E harness, 4 shards (Phase 32, below)
#   browser           ~12 min   the e2e/ browser suite, 5 shards (chromium 3, serial 2)
#
# And what does NOT:
#
#   claude-review     varies    advisory permanently, see claude-review.yml
#
# THE HARNESS BLOCKS NOW, IN SHARDS (Phase 32, carried item 3).
#
# It used to live only in e2e-harness.yml, nightly and on demand: at 139
# tests it ran 99s on an M-series Mac but did not finish in 20 minutes on
# ubuntu-latest, because playwright.harness.config.ts runs `workers: 1` and
# every test boots a real backend subprocess through tsx. By Phase 32 it had
# grown to 644 tests and ~28 min in a 4-core container, and every Stage 0
# step ran it by hand before merging. Sharded by file across four jobs, its
# first run took 1.9–3.8 min a shard on ubuntu-latest (177 + 153 + … tests),
# far under the old single-job number. If a shard nears its 30-minute
# timeout, add shards rather than raising the timeout.
#
# The browser suite (e2e/) runs in five shards beside it and blocks too
# (chromium in three, the serial project in two, since Phase 32 HD4):
# green on its first run here, 8.6–11.2 min a shard. See docs/E2E-HARNESS.md.

name: ci

on:
  pull_request:
    # feat/phase-* are integration branches: milestone PRs land there and
    # the phase merges into main once. Without this, those PRs are untested.
    branches: [main, 'feat/phase-*']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A rapid series of pushes cancels its own earlier runs rather than queueing
# them. Never cancel on main — those runs are the record of what landed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  # Guard: nothing under docs/private/ may ever be tracked.
  #
  # This repo is PUBLIC and docs/private/ holds the Phase 19 finding register —
  # unremediated issues with file paths. .gitignore covers it, but a gitignore
  # is a default, not an enforcement: `git add -f` beats it, and so does anyone
  # editing the ignore rule. This job is the enforcement.
  #
  # Cheap and first, so it fails in seconds rather than after a full install.
  # ---------------------------------------------------------------------------
  no-private-docs:
    name: No private docs tracked
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7

      - name: Assert docs/private/ is untracked
        run: |
          tracked=$(git ls-files docs/private/ || true)
          if [ -n "$tracked" ]; then
            echo "::error::Files under docs/private/ are tracked in git."
            echo "$tracked" | sed 's/^/  /'
            echo ""
            echo "This repository is public. docs/private/ holds the security"
            echo "finding register and must never be committed."
            echo "Fix: git rm --cached <file> && confirm .gitignore covers it."
            exit 1
          fi
          echo "docs/private/ is clean"

  # ---------------------------------------------------------------------------
  # Desktop: typecheck + production build.
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop (typecheck + build)
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The conformity step below diffs this branch against its base.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` and not `npm install`: CI installs exactly the lockfile, and
      # fails if package.json and the lockfile disagree. That disagreement is
      # worth failing on — it means someone edited one without the other.
      #
      # --ignore-scripts on every root install (Phase 32 HD4c). npm 11.19 still
      # runs dependency install scripts, only warning that it will stop: so
      # better-sqlite3 rebuilt from source on every job, downloading Node's
      # headers, and on #224 node-gyp crashed doing it before any test ran.
      # better-sqlite3 and node-pty load from their prebuilds (checked below
      # and by the harness), esbuild from its platform package, and the
      # grammars' .wasm files are committed. The root postinstall is a script
      # too, so patch-package is run by hand and check-patches proves it.
      - name: Install
        run: npm ci --ignore-scripts && npx patch-package && node scripts/check-patches.cjs

      - name: Typecheck
        run: npm run typecheck

      # THE HIGHEST-VALUE CHECK IN THIS FILE.
      #
      # `require('./relative')` in src/backend survives typecheck, survives
      # `npm run build`, and works in dev — then throws MODULE_NOT_FOUND in the
      # packaged app, because rollup leaves runtime CommonJS requires alone and
      # the relative path does not exist next to the bundled main.js.
      #
      # This has shipped broken to users twice. scripts/check-no-relative-require.sh
      # was added to catch it, but it was only wired into the `package:*`
      # scripts — so it fires on release day, not on the PR that introduced the
      # bug. Running it here moves the catch to where it is cheap.
      - name: Bundle guard (no relative require in src/backend)
        run: npm run check:bundle

      # Note this is the WEB build (tsc + vite). It is not the Electron
      # package — that needs electron-builder and a native toolchain per OS,
      # which is what build-installers.yml is for. Green here does not mean the
      # installer builds; the bundle guard above is what covers the gap that
      # actually bit us.
      - name: Build (web)
        run: npm run build

      # Unit tests live here rather than with the harness. They are fast and
      # hermetic (plain node:test over the service layer, no subprocess, no
      # browser), so they can block — which they cannot do sitting inside an
      # advisory job.
      # The material reader's bundle — what ships — so the unit tests read
      # through it under the permission model, not only through the source.
      - name: Build (material reader)
        run: npm run build:reader

      # The same suite as `npm run test:unit`, also writing JUnit for the
      # conformity step.
      - name: Unit tests
        id: unit
        run: npm run test:unit:junit

      - name: Lint
        run: npm run lint

      # Phase 32 D1.4: this repository uses its own CLI the way
      # docs/recipes/github-actions.yml tells others to. CodeTrellis runs
      # headless in the runner, hears the unit run, and fails the job when
      # this pull request's change does not conform: a changed file whose
      # tests fail or are older than the code, a done task whose criterion
      # check fails, or a system doc describing a changed file gone stale.
      - name: CodeTrellis conformity
        if: github.event_name == 'pull_request' && always() && steps.unit.outcome != 'skipped'
        run: |
          node bin/codetrellis.mjs start --quiet
          node bin/codetrellis.mjs report-tests test-results/unit.xml
          node bin/codetrellis.mjs check

      - name: Stop CodeTrellis
        if: always()
        run: node bin/codetrellis.mjs stop || true

  # ---------------------------------------------------------------------------
  # Mobile: typecheck only.
  #
  # No build here — an EAS build needs credentials and a queue slot, and a
  # local prebuild needs Xcode or the Android SDK, neither of which a Linux
  # runner has. Typecheck is what CI can honestly assert about mobile; that the
  # native projects still build is a human check on a machine with the
  # toolchain. Say so rather than letting green CI imply more than it means.
  # ---------------------------------------------------------------------------
  mobile:
    name: Mobile (typecheck)
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # The phone's screens, rendered and photographed (Phase 32 A4.5a).
  #
  # The companion's real screens from mobile/, through react-native-web, with
  # native modules stubbed and RPC answered from fixtures
  # (tools/phone-preview, tests/phone). Until this, phone screens were
  # typechecked and linted and never looked at. The screenshots are uploaded
  # on every run, so a PR that changes a screen can be seen.
  # ---------------------------------------------------------------------------
  phone:
    name: Phone screens (rendered)
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts && npx patch-package && node scripts/check-patches.cjs
      - name: Install mobile dependencies
        run: npm ci --prefix mobile
      - name: Install Playwright runner
        run: npx playwright install --with-deps chromium
      - name: Phone screens
        run: npm run test:phone
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phone-screens-${{ github.run_id }}
          path: |
            test-results/phone/
            playwright-report/phone/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The sandboxed HTML view (Phase 31 §7.3), in real Electron.
  #
  # A report that tries every way out — remote loads, fetch, sockets,
  # beacons, forms, pop-ups, navigation, file:, path traversal, other apps
  # through the OS — shown by the real src/electron/html-view.ts, scripts off
  # and then on, against a listener that must count zero. Chromium's sandbox
  # stays on: Ubuntu 24.04 restricts the unprivileged user namespaces it
  # needs, so that restriction is lifted for this job rather than the
  # sandbox being turned off. The Electron binary is fetched here because
  # npm no longer runs install scripts.
  # ---------------------------------------------------------------------------
  html-view:
    name: HTML view sandbox (Electron)
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts && npx patch-package && node scripts/check-patches.cjs && node node_modules/electron/install.js
      - name: Allow Chromium's sandbox its user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Hostile report
        run: npx tsx tools/html-view-hostile/run.ts
      # A packaged renderer is a file:// page, which no browser spec runs:
      # this is the only test of how artefact bytes reach it.
      - name: Artefact bytes in a file:// renderer
        run: npx tsx tools/artefact-transport-check/run.ts

      # The sign-off pack's PDF is printed in a hidden Electron window; this
      # is the only test that it produces a PDF and reaches no network.
      - name: Sign-off pack PDF
        run: npx tsx tools/signoff-pdf-check/run.ts

      # Chromium downloads Hunspell dictionaries from Google unless one is
      # already in place. The app ships its own; this is the only test that
      # none is ever fetched.
      - name: Spell-check dictionaries bundled
        run: npx tsx tools/spellcheck-check/run.ts

  # ---------------------------------------------------------------------------
  # The hermetic harness, in four shards — blocking (Phase 32, carried item 3).
  #
  # 644 tests, ~28 min in one 4-core container with `workers: 1`, because every
  # test boots a real backend subprocess. That is what kept it out of this file
  # (see the header). Sharded across four jobs by file, each shard is a
  # quarter of that. Every Stage 0 step ran it by hand; now every PR does.
  # ---------------------------------------------------------------------------
  harness:
    name: Harness (${{ matrix.shard }}/4)
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts && npx patch-package && node scripts/check-patches.cjs
      # A wrong-architecture native binding fails every backend-booting test at
      # once and reads as flakiness. Fail here with the fix instead.
      - name: Verify native binding
        run: |
          node -e "const B=require('better-sqlite3');new B(':memory:').exec('create table t(a)');console.log('better-sqlite3 OK on',process.version,process.arch)" \
            || { echo "::error::better-sqlite3 native binding failed to load — wrong arch or Node version. Try: npm rebuild better-sqlite3"; exit 1; }
      # The harness git-inits its fixture repos.
      - name: Configure git for fixtures
        run: |
          git config --global user.email "ci@codetrellis.invalid"
          git config --global user.name "CodeTrellis CI"
      # build-artifacts.test.ts compares the desktop's shared dependencies with
      # the companion's, and skips without mobile/node_modules. No skips here.
      - name: Install mobile dependencies
        run: npm ci --prefix mobile
      - name: Install Playwright runner
        run: npx playwright install --with-deps chromium
      - name: Harness, shard ${{ matrix.shard }} of 4
        run: npx playwright test --config=playwright.harness.config.ts --shard=${{ matrix.shard }}/4
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: harness-report-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The browser suite (e2e/), in five shards — blocking.
  #
  # It drives the real app through Vite and needs no desktop session on a
  # runner. It was added here reporting only, because it had known failures
  # the last time it ran on CI; its first run here was green in all three
  # shards (277, 265 and the rest passed, 8.6–11.2 min), so it blocks.
  #
  # Two projects, sharded apart (Phase 32 HD4): `chromium` in three shards
  # with two workers, and `serial` (the specs that need the backend to
  # themselves) in two, one worker each. As setup's teardown, `serial` used to
  # run in full in every shard, because Playwright never shards a teardown:
  # 170 tests one at a time, three times over, which took the shards to
  # 18–28 min by Wave 2's review. E2E_SPLIT=1 makes it an ordinary dependent
  # of setup instead; each job has its own backend, so a serial spec still
  # has one to itself.
  # ---------------------------------------------------------------------------
  browser:
    name: Browser suite (${{ matrix.label }})
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, shard: '1/3', label: '1/3', id: 'c1' }
          - { project: chromium, shard: '2/3', label: '2/3', id: 'c2' }
          - { project: chromium, shard: '3/3', label: '3/3', id: 'c3' }
          - { project: serial, shard: '1/2', label: 'serial 1/2', id: 's1' }
          - { project: serial, shard: '2/2', label: 'serial 2/2', id: 's2' }
    env:
      # playwright.config.ts gives each run its own temp data dir and token,
      # and fails on a busy port rather than reusing a stray server.
      E2E_WORKERS: '2'
      E2E_SPLIT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts && npx patch-package && node scripts/check-patches.cjs
      - name: Verify native binding
        run: |
          node -e "const B=require('better-sqlite3');new B(':memory:').exec('create table t(a)');console.log('better-sqlite3 OK on',process.version,process.arch)" \
            || { echo "::error::better-sqlite3 native binding failed to load"; exit 1; }
      - name: Configure git
        run: |
          git config --global user.email "ci@codetrellis.invalid"
          git config --global user.name "CodeTrellis CI"
      - name: Install Playwright runner
        run: npx playwright install --with-deps chromium
      - name: Browser suite, ${{ matrix.project }} shard ${{ matrix.shard }}
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }} --reporter=list,html
      - name: What each failing page showed
        # The snapshot Playwright writes beside every failure, in the log itself.
        if: failure()
        run: |
          for f in test-results/*/error-context.md; do
            [ -f "$f" ] || continue
            echo "::group::$(dirname "$f")"
            head -c 20000 "$f"
            echo "::endgroup::"
          done
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-report-${{ matrix.id }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # THE ONLY CONTEXT BRANCH PROTECTION PINS.
  #
  # `if: always()` so it runs even when a dependency failed — without it the
  # job is skipped, and a skipped required check leaves the PR waiting forever
  # on a status that will never report.
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI passed
    if: always()
    # `harness` (four shards) and `browser` (five: chromium 3, serial 2) block (Phase 32).
    needs: [no-private-docs, desktop, mobile, phone, html-view, harness, browser]
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Check results
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -q '"result": *"failure"'; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          if echo "$results" | grep -q '"result": *"cancelled"'; then
            echo "::error::One or more CI jobs were cancelled."
            exit 1
          fi
          echo "all CI jobs passed"
