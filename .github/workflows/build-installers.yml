name: Build installers (Windows + Linux)

# Why this exists:
# CodeTrellis has native modules (better-sqlite3, node-pty). node-pty cannot be
# cross-compiled from macOS to Windows/Linux (node-gyp can't cross-OS), so the
# mac dev box can only produce the signed macOS DMGs. This workflow builds the
# Windows + Linux installers on their *own* OS runners, where node-pty compiles
# cleanly.
#
# How the installers get back to release.sh:
# Each job uploads its installers as assets on a transient **staging release on
# THIS repo** (`STAGING_TAG`), using the default GITHUB_TOKEN — a same-repo
# operation that does NOT touch the Actions *artifact storage* quota (which is
# small and lags 6-12h on recalc, and used to block releases). release.sh then
# downloads those release assets locally (where the operator's gh has access to
# both repos), publishes the public release, and deletes the staging release.
# No cross-repo PAT needed, and no dependence on artifact storage.
#
# Trigger: release.sh runs it via workflow_dispatch with `tag=<STAGING_TAG>`,
# or it runs on a v* tag push (staging onto that tag).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Staging release tag on this repo to upload installers to'
        required: true
        default: ci-staging
  push:
    tags: ['v*']

permissions:
  contents: write   # create/upload the staging release on this repo

env:
  STAGING_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install deps
        run: npm install --legacy-peer-deps
      - name: Build NSIS installer + portable exe
        run: npm run package:win -- --publish never
      - name: Stage installers on the CI release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$STAGING_TAG" --prerelease --target "$GITHUB_SHA" \
            --title "CI staging $STAGING_TAG" \
            --notes "Transient CI build assets — deleted once the public release is cut." 2>/dev/null || true
          gh release upload "$STAGING_TAG" out/make/*Setup*.exe out/make/*Portable*.exe --clobber

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install deps
        run: npm install --legacy-peer-deps
      - name: Install rpm tooling
        # ubuntu-latest has dpkg/fakeroot for .deb, but not rpmbuild for .rpm.
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build AppImage + .deb + .rpm (x64)
        run: npm run package:linux -- AppImage deb rpm --publish never
      - name: Stage installers on the CI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$STAGING_TAG" --prerelease --target "$GITHUB_SHA" \
            --title "CI staging $STAGING_TAG" \
            --notes "Transient CI build assets — deleted once the public release is cut." 2>/dev/null || true
          gh release upload "$STAGING_TAG" out/make/*.AppImage out/make/*.deb out/make/*.rpm --clobber

  linux-arm64:
    # GitHub-hosted arm64 Linux runner. node-pty compiles natively here, so this
    # produces real arm64 .deb/.rpm/AppImage (cross-compiling from x64 can't).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install deps
        run: npm install --legacy-peer-deps
      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build AppImage + .deb + .rpm (arm64)
        run: npm run package:linux -- AppImage deb rpm --publish never
      - name: Stage installers on the CI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$STAGING_TAG" --prerelease --target "$GITHUB_SHA" \
            --title "CI staging $STAGING_TAG" \
            --notes "Transient CI build assets — deleted once the public release is cut." 2>/dev/null || true
          gh release upload "$STAGING_TAG" out/make/*.AppImage out/make/*.deb out/make/*.rpm --clobber
