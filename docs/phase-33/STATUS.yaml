# Phase 33 status — the Now block and the checklist, as data.
#
# Hand-edited. `npm run status` writes the Now and Checklist sections of
# docs/phase-33/LOG.md from this file and git; `npm run status:page` also
# writes the progress page (docs/phase-33/EXECUTION.md §1.1). A unit test
# fails when the LOG's items differ from these. The dated entries stay prose
# in the LOG. See tools/status/.
#
# Only intent is written here. Whether a step is building, in review or
# done, and its PRs, are read from git and GitHub (a step has a branch,
# feat/phase-33-<id>-…, and lands as `Phase 33 <id>: … (#N)`).
#
# An item: id (when it has one), title, followUp (found on the way, not
# planned), items (its parts). Only for what git cannot see: status (done)
# and prs. A section's goal is shown on the progress page only.
#
# The checklist is grouped by track; the order of work is EXECUTION §2.
now:
  step: "C6: graduation — what agent reviews keep finding becomes a proposed rule"
  status: "In review"
  next: "Merge C6 when CI is green, then build R10 (this repository's own rulebook, measured against today's code), then Z1"
  blockers: "None"
  updated: 2026-10-07
sections:
  - title: Setup
    goal: The phase can be picked up cold by any session, and its progress read on one page.
    items:
      - title: Integration branch `feat/phase-33` cut from `main` (`5fb23f4`)
        status: done
      - title: Status tooling serves any phase (and reads Phase 32's D and E steps, which the old pattern missed)
        status: done
        prs:
          - 346
      - title: The progress page, generated from the status (`npm run status:page`) and published as an artifact
        status: done
        prs:
          - 346
      - title: Design, execution plan, status and this log
        status: done
        prs:
          - 346
      - title: CLAUDE.md points every session here
        status: done
        prs:
          - 346
      - title: "A new advisory (sprintf-js, GHSA-hp3w-g68c-fv3c) failed the production audit on every branch: kept out of the tree by an override (into `main`)"
        followUp: true
        status: done
        prs:
          - 347
      - title: "A new advisory (MCP SDK, GHSA-6qxp-vccf-f47h) failed the production audit on every branch: SDK 1.32.1 (into `main`)"
        followUp: true
        status: done
        prs:
          - 355
      - title: "With many worktrees of one repository, `listWorkstreams` takes ~10 s and six parallel asks for it fill the browser's connections, so the graph waits behind them: share one answer"
        followUp: true
      - title: "Call rules read HTTP and SQL callsites; no extractor finds subprocess commands or environment variables yet, so those calls cannot be ruled on"
        followUp: true
      - title: "Rebalance the browser shards: chromium 2/3 runs 185 tests in about 25 minutes, the others about 7"
        followUp: true
        status: done
        prs:
          - 367
      - title: "Four browser specs fail in a local clone with many fetched branches and pass in CI (evolution, play-forward, navigate_to Awareness, signal-to-lines): find why"
        followUp: true
      - title: "rules-overlay.spec drew no edges in CI: React Flow held every node measured and none with handle positions, and nothing measured them again; the canvas now does (`RemeasureHandles`)"
        followUp: true
        status: done
        prs:
          - 387
      - title: "The plan-panel and inspector Allotment resize throws on load (minimumSize of undefined), caught and logged since Phase 31"
        followUp: true
      - title: "C5 is not yet seen reviewing on this repo: it has no CLAUDE_CODE_OAUTH_TOKEN secret, so codetrellis-review.yml and claude-review.yml review nothing. Deferred by the owner (2026-10-07): a public repo's PRs can read its secrets, so agent review here waits; deterministic rules (R10) come first"
        followUp: true
  - title: "Stage 0: ground truth"
    goal: Numbers to measure against, the freeze measured, and every colour the app draws written down.
    items:
      - id: "0.1"
        title: Baseline (Node 26, clean `npm ci`, every suite and the lint warning count)
      - id: "0.2"
        title: Measure the plan reload storm in a harness test (imports, broadcasts, response time)
      - id: "0.3"
        title: Colour audit (every colour, its meaning and where), the draft visual vocabulary
  - title: "Track S: quiet under load"
    goal: A burst of plan changes on disk is one reload and one notice, and the app never freezes.
    items:
      - id: S1
        title: One import per plan per burst (the watcher coalesces)
      - id: S2
        title: The window takes a burst as one (one refetch, one toast)
      - id: S3
        title: Under load end to end (200 files, 5 plans; the owner's real `git pull`)
  - title: "Track R: the rulebook"
    goal: The team can say where any file, package, name, URL or command may be used; rules are files, and loosening one is always a person's signed act.
    items:
      - id: R1
        title: Rules live in `.codetrellis/rules/<suite>.yaml` (moved from config.json by a person's confirm)
      - id: R2
        title: CI judges with the base branch's rules; a rulebook change is its own finding
      - id: R3
        title: "Change control: preview the effect, a person confirms, loosening is signed, `propose_rule` for agents"
      - id: R4
        title: "Strength: block, warn, guide (exit codes, `--strict`, signals)"
      - id: R5
        title: Package rules across all eleven languages (only the wrapper imports `stripe`)
      - id: R6
        title: Symbol rules (who may import a named export, through re-exports)
      - id: R7
        title: Call rules (HTTP hosts, commands, tables, env)
      - id: R8
        title: Folder rules (what files in a folder are)
      - id: R9
        title: Guide rules in scope (the brief, `get_brief`, drift names the rule)
      - id: R10
        title: "This repository's own rulebook: its layering, the native packages and its folder conventions, checked on every pull request with no AI and no secret"
  - title: "Track C: checks anywhere"
    goal: Any rule, suite or path checked on a laptop or in any CI, and agent checks on the team's own model.
    items:
      - id: C1
        title: Scoped checks (`--suite`, `--rule`, `--path`; MCP and REST alike)
      - id: C2
        title: SARIF output, host-neutral; recipes are examples for any CI (no host first)
      - id: C3
        title: Debt ratchet (existing breaches may only fall)
      - id: C4
        title: "Agent checks locally on the user's own agent: the orchestrator, passes, the headless contract (allowlisted tools, no ask, must report, budgets, grounded citations, four outcomes)"
      - id: C4b
        title: Bring your own agent locally (`get_review_bundle`, `report_review`; citations still verified)
      - id: C5
        title: Agent checks in CI (host adapter, OIDC, cost dial, the optional verify pass)
      - id: C6
        title: Graduation (a repeated finding proposes a rule)
      - id: C7
        title: Check runs are records that travel (`.codetrellis/runs/checks/`), wherever they ran
      - id: C8
        title: "One renderer for rules and findings: terminal, markdown, SARIF and the app say the same words"
  - title: "Track G: graph and clarity"
    goal: Every colour means one thing and is explained; the graph can be focused; selecting a file shows its plans; opening a plan shows it; rules are seen where the code is.
    items:
      - id: G1
        title: One visual vocabulary (colour, glyph, dash, words) with a guard test
      - id: G2
        title: The legend on the graph, plan canvas, file tree and Timeline
      - id: G3
        title: Edge toggles (imports, cross-system, symbol links)
      - id: G4
        title: Graph full screen and back; hidden panes leave no gap
      - id: G5
        title: Selecting a file lists the plans and tasks that touch it
      - id: G6
        title: Opening a plan always shows it, from a chip too
      - id: G7
        title: The Rules view (its own workspace, not Settings)
      - id: G8
        title: Rules on the graph (breaches drawn, rules for the selected file)
      - id: G9
        title: The Checks view (run any check from the app, CI runs beside local ones, compare runs)
      - id: G10
        title: Findings where the code is (graph, code gutter, inspector, brief, phone)
  - title: "Track V: review (the owner's picks)"
    goal: Review that starts from what a change does to the architecture and what it would cost to get wrong, useful with or without a plan behind the change.
    items:
      - id: V1
        title: What this change does to the architecture (structural diff at the top of every review)
      - id: V2
        title: Review in order of risk (dependents, rule scope, test grounding, other work)
      - id: V3
        title: Re-review only what changed since each reviewer's last look
      - id: V6
        title: Did the change do what the task said (only when it is linked to a task)
  - title: "Stage Z: close"
    goal: Documented, walked by the owner on a packaged build, merged and released.
    items:
      - id: Z1
        title: "Docs: `docs/claude/rules.md`, CLI and MCP references, the change-control security rule"
      - id: Z2
        title: Phase review on a packaged build
      - id: Z3
        title: Into `main` and release
# The screens the phase built, shown on the progress page under "See it",
# taken by the browser suite into test-results/ux-audit/.
shots:
  - file: rules-view.png
    step: G7
    title: The Rules view
    says: Its own workspace beside Code and Docs. Each suite says whether it holds; each rule its reason, its strength and its file; a new rule of any of five kinds; and the history of changes.
  - file: rules-settings-proposal.png
    step: R3
    title: An agent proposes, a person decides
    says: An agent asked to drop a rule. The card says what that would allow against the code today. Accepting signs it with your key, and CI counts it only if that key is already on the base branch.
  - file: checks-view.png
    step: G9
    title: The Checks tab
    says: Every check run, from the app or CI. Each finding with its fix and a way to the graph and the code; two runs compared into new, fixed and unchanged.
  - file: checks-view-review.png
    step: C4b
    title: An agent's review, checked by code
    says: Only findings that quote lines in the diff are kept. A planted "ignore your instructions" comment is flagged as suspicious, and a finding off the diff is dropped, with why.
  - file: findings-inspector.png
    step: G10
    title: Findings where the code is
    says: Select a file and the inspector says what the latest check found in it, with a ⊘ on the line in the code.
  - file: findings-brief.png
    step: G10
    title: The rules in a task's brief
    says: Which rules judge this task's files, what the latest check found in them, and what to do instead, for the person and the agent.
  - file: awareness-drift-rule.png
    step: R9
    title: A rule in scope, in the overlap card
    says: Work outside its scope names the rule that applies there, so the person and the agents see it before anything is checked.
  - file: graph-overlays-menu.png
    step: G1, G3
    title: The graph's legend, Edges and Overlays
    says: The legend lists only what is on screen. Each kind of edge can be turned off, and cross-system links are drawn dotted, apart from imports.
