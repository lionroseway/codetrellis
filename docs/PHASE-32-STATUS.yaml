      - title: "`e2e/golden-chain/onboarding-to-plan.spec.ts` imports `API` and never uses it, a lint error that predates #213. `npm run lint` covers `src/` only, so nothing reports it; either lint `e2e/` too or drop the import the next time the spec is touched. Dropped in #227, which touched the spec."
        status: done
        followUp: true
      - title: "#219 (A4.4, backend only) failed browser 3/3 on `review-regressions/pr55-ui.spec.ts:431` (the linked-ticket chip again, after #195/#196 were thought to fix it) and `golden-chain/onboarding-to-plan.spec.ts:80` (the canvas task detail never appeared, even with #213's 10 s poll; 3 of 3 locally on its own). Neither touches an A4 file. Both need the page captured before `afterEach` clears it, so the next failure shows what was on screen instead of only the missing element. **Both found.** pr55-ui was a lost click in a moving plan list, fixed in #225. onboarding-to-plan:80 failed again on #227 (482e18c), and the cause is in the spec: once the workspace is up, the item's title shows in six places (the tree, the board, the next-item strip…). `getByText('First task').first()` took whichever existed first, so with the tree not yet rendered the click landed on another list's button and no canvas detail came. The spec now finds and clicks the items inside `plan-item-tree`."
        status: done
        followUp: true
      - title: "`graph/node-click.spec.ts:68` failed on #224: `reachableNodes` (`e2e/helpers/setup.ts`) waited on `.react-flow__node` `.first()`, and the first node was `cluster:billingcore`, which stayed hidden on all 34 checks while others were in the DOM. **Fixed:** it waits for a visible node; the polling after it already handles layout and cover."
        status: done
        followUp: true
      - title: "`review-regressions/pr55-ui.spec.ts:431` failed again, on #224. The page snapshot shows the plan list still up after the click on \"ct-m8 ticket chip\": the plan never opened, or opened and dropped back. That is the same class as the `plan-by-hand` follow-up above (a plan workspace dropping back while another worker changes plans). The server log also showed another project's scan refused while one ran (\"serving file tree only\"), though the spec's own open helper retries that. Find which broadcast leaves the workspace; do not lengthen the wait. **Fixed in #225, three causes, none a broadcast leaving the workspace:** (1) the spec clicked `getByText('ct-m8 ticket chip')`, which the \"New plan created\" toast also matches; it now clicks the plan row's own button. (2) Every plan created on the other worker refetches the list, and an older `fetchPlans` answer could land after a newer one and put rows back where they were, moving the row under the pointer; the store now drops an out-of-order answer (`plan-store.test.ts`). (3) A real UX bug the retry exposed: the row of the plan already active did nothing, because the workspace opened only when the active plan *changed*, so a minimised plan could not be reopened from its own row. It opens now (`plan/reopen-active-plan.spec.ts`, which fails without the fix)."
        status: done
        followUp: true
      - title: "`graph/graph-own-project.spec.ts:23` failed on #225 (0465ca2): three clusters (`broken`, `evidencepreview`, `paths`) were missing after the other project's scan. They were still in the graph. The canvas mounts only nodes in view (`onlyRenderVisibleElements`), and this repository's graph is fitted at the 0.1 minimum zoom with nodes past the edge: locally 117 nodes, 114 in the DOM. So the DOM ids moved with the viewport. The spec now reads the whole graph from the minimap, which draws every node at its layout position. A new file added mid-test fails it with exactly one new node, and other runs pass unchanged."
        status: done
        followUp: true
      - title: "`project/folder-picker.spec.ts` \"Go button browses to typed path\" failed on #225 (ff50abc): the path input still said the home folder after `/tmp` was typed and Go pressed. The cause was a real bug: the picker's opening browse could answer after a later one and put its folder back, over a Go or over a path typed while it loaded. Browses are now numbered, only the latest one applies, and a path typed since a browse was sent is kept. Two new specs delay the opening listing and fail without the fix."
        status: done
        followUp: true
      - title: "`graph/graph-breakpoints.spec.ts:34` failed on #225 (ff50abc). `reachableNodes` found a visible node, then no node that stayed uncovered and still for 15 s, on the sample app at Files depth in Map layout. The page snapshot showed the sample app's graph loaded (status bar 196, 34/73 imports) but no nodes or edges in the canvas. It does not reproduce locally, even with the CPU throttled 6×: 21 nodes, the minimap and DOM agree, and the view settles at once. The helper's error now says what it saw (nodes in the DOM and the minimap, zero-size, what covers them, the viewport, whether they were still moving), so the next failure names the cause. The prime suspect is the shared backend switching projects under the canvas (the AST tables hold one project at a time). **Then `graph/multi-select.spec.ts:40` failed the same way on #226 (no node visible for 15 s on a fresh sample-app page), and a cause was found in the canvas:** when the backend holds another project's graph, an empty canvas rescans its own project. A refused rescan (the scan route answers 200 with `astError` \"already in progress\" while the other scan runs) was treated as success, and the canvas asked again at once. Its comment said it waited a second, but only a thrown error did. So it spent all 120 tries in a few seconds and stayed empty. A refusal now waits a second. `graph/canvas-rescan-wait.spec.ts` reproduces it with the refusals intercepted: 18 ms between rescans without the fix, a second with it, and the graph arrives. The helper's first wait now reports what the canvas held too."
        status: done
        followUp: true
      - title: "`graph/node-click.spec.ts:43` failed on #226 (665f996), and this time the helper's new message named the cause: `{\"inDom\":14,\"zeroSize\":0,\"inMinimap\":0,…}`. That is 14 nodes with a size, none visible, and none in the minimap, which is React Flow 12's state for nodes it has not measured (it draws them `visibility: hidden` and the minimap skips them). The canvas rebuilds every node object when its overlays change (selection, plan highlight, work counts, collisions), and `preserveNodePositions` kept only the position and dropped `measured`. So every such change hid the whole graph for a frame. When a rebuild landed in the same batch as React Flow's dimension change, the node stayed unmeasured and the observer effect did not run again: nothing had changed size, so the ResizeObserver never fired and the canvas stayed empty. This is the likeliest root cause of the empty-canvas failures (graph-breakpoints, multi-select, node-click). The function moved to `lib/preserve-node-positions.ts` and keeps `measured`. `graph/nodes-stay-drawn.spec.ts` watches every node while nodes are selected and cleared: all 14 went hidden without the fix, none with it. (The refused-rescan loop fixed alongside is a real bug too, but it did not explain nodes that were in the DOM and unmeasured.) CLAUDE.md said ReactFlow 11, as did AGENTS.md and `docs/claude/architecture.md`; the installed package is `@xyflow/react` 12.11.6. All three say React Flow 12 since A5.7."
        status: done
        followUp: true
      - title: "CI's `npm ci` runs `better-sqlite3`'s install script, so node-gyp downloads the Node headers on every job. On #224 (be91267), Harness (1/4) died there before any test ran: node-gyp's bundled undici crashed (`assert(!this.paused)`) reading the Node 26.10.0 headers. The module ships prebuilds, and CLAUDE.md says npm 11.19+ skips install scripts, which is not what CI does. Find out why the scripts run (npm config or the setup action), and whether `npm ci --ignore-scripts` plus the load checks CLAUDE.md gives is safe for `better-sqlite3` and `node-pty`."
        followUp: true
      - title: "`graph/edge-visuals.spec.ts:12` timed out on #226 (d4236dc) at 32 s, with the graph's edges in the DOM. The test had the default 30 s budget, but `gotoWithProject` itself waits up to 60 s for another project's scan and 30 s for the canvas, so a project opened while another scan ran ran out of test time inside the helper. 75 specs open a project on the default budget. The helper now raises the test's timeout to cover its own waits (at least 120 s; a longer budget a test set is kept)."
        status: done
        followUp: true
      - title: "`golden-chain/onboarding-to-plan.spec.ts:80` failed again on #227 (2d3ced2), after the click was scoped to `plan-item-tree`. The tree item was there and clicked, and the item's detail still did not show within 10 s. It passes locally, 15 of 15, 4 of 4 with the CPU throttled 6×, and with test 188 run first. Test 188 leaves no plan behind. `selectItem` is not a toggle. Candidates, not confirmed: the workspace's hydrate effect runs twice on open and fetches the items twice; an agent's navigation broadcast from the MCP specs that run just before; the workspace closing. The failure now prints what was on screen at that moment (tree, selected row, which texts are there), because the page snapshot is taken after `afterEach` deletes the plan. **Found, and it was the first candidate.** The diagnostic (adb03d9) said the row was selected and neither the body nor the status was on the page. Opening a plan loads its items twice: `resetForPlan` changes the store's plan id, which re-runs the workspace's effect while the first load is out. The list carries summaries without a body. When the second answer landed after the item had been opened, it put the summary back over the full item, so `BodyEditor` saw an empty body and fell into its editor, and a textarea's value is not page text. A person saw the same thing: a task opened quickly after its plan showed an empty editor where its body was. Fixed in `plan-items-store`: one load per plan at a time, the summary adds to an item's full fields rather than replacing them, and a list for a plan no longer open is dropped. `plan-items-store.test.ts` fails without it (two list requests, and the stale list wins)."
        status: done
        followUp: true
      - title: "`golden-chain/websocket-events.spec.ts:97` failed on #226 (115d49c, browser 1/3): a socket opened from the page did not report `open` within three seconds, and the check said only `false`. The backend parses synchronously, so an upgrade that arrives during a scan waits for it, and the open project there was this repository. That is likely, not confirmed. Its sibling at :19 had the same three-second timer. Both now share `openSocket`, which gives the upgrade 15 s and says how it ended (`open`, `error`, `closed <code>`, `no answer`), so a repeat names its cause."
        status: done
        followUp: true
