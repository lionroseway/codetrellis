      - title: "`agent/workstream-strip.spec.ts:89` failed once on #205 (653c3e1): the chip read `[expanded]`, but `workstream-popover` never appeared and the test ran out of its 30 s (36.1 s; its siblings took about 9 s). Nothing in #205 touches the strip; it passed on the previous commit, locally 18 of 18 twice, and on the one re-run. Its cause is not found: the failure snapshot CI prints is cut at 20 KB, before the end of `<body>` where the popover is portalled. Next time it fails, keep the whole error context (raise the `head -c` limit in CI for that file). **Failed again on #212** (browser 1/3) beside `graph/edge-visuals.spec.ts:32`, both at 30 s. `edge-visuals` counts edges after a fixed `waitForTimeout(2000)` three times over; that class (a fixed wait, then a count) is what `onboarding-to-plan` had until #213 polled it. Poll both specs on what they wait for."
